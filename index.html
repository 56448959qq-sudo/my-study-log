<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習ログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">localStorage study log</p>
            <h1 id="app-title">学習ログ</h1>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="diary-form" class="diary-form">
          <label class="field-label" for="entry-date">学習日</label>
          <input id="entry-date" name="date" type="date" required />

          <fieldset class="mood-field">
            <legend>集中度</legend>
            <div class="mood-grid" id="mood-grid">
              <label class="mood-option">
                <input type="radio" name="mood" value="focused" required />
                <span class="mood-face">🔥</span>
                <span>高い</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="steady" />
                <span class="mood-face">✅</span>
                <span>良好</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="normal" />
                <span class="mood-face">🙂</span>
                <span>普通</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="tired" />
                <span class="mood-face">😵‍💫</span>
                <span>低め</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="low" />
                <span class="mood-face">😴</span>
                <span>低い</span>
              </label>
            </div>
          </fieldset>

          <label class="field-label" for="entry-note">学習メモ</label>
          <textarea
            id="entry-note"
            name="note"
            rows="5"
            maxlength="160"
            placeholder="今日の学習内容や気づきを短く書いてみよう"
            required
          ></textarea>
          <div class="note-meta">
            <span id="editing-label">学習記録を書いています</span>
            <span><span id="char-count">0</span>/160</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">study records</p>
            <h2 id="history-title">学習記録</h2>
          </div>
          <div class="stats-strip" aria-label="記録数">
            <strong id="entry-count">0</strong>
            <span>days</span>
          </div>
        </div>

        <section class="biorhythm" aria-labelledby="biorhythm-title">
          <div>
            <p class="biorhythm-label" id="biorhythm-title">学習リズム</p>
            <strong id="biorhythm-message">記録を保存すると表示されます</strong>
          </div>
          <div class="rhythm-chart" id="rhythm-chart" aria-label="最近7件の学習の流れ"></div>
          <p id="biorhythm-detail" class="biorhythm-detail">最近7件の集中度の変化を表示します。</p>
        </section>

        <div class="summary-row" id="summary-row" aria-label="集中度の集計"></div>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>検索</span>
            <input id="search-input" type="search" placeholder="学習メモから探す" />
          </label>
          <select id="mood-filter" aria-label="集中度で絞り込み">
            <option value="all">すべての集中度</option>
            <option value="focused">高い</option>
            <option value="steady">良好</option>
            <option value="normal">普通</option>
            <option value="tired">低め</option>
            <option value="low">低い</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>まだ記録がありません</strong>
          <span>今日の学習内容とメモを保存すると、ここに表示されます。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="保存した学習記録一覧"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
